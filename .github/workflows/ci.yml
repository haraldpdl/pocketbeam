name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: .go-version, check-latest: true }
      # Same gates as `make ci` locally. The race detector and go-sqlite3
      # both need cgo, which GitHub runners have. The SDK toolchain is
      # absent here, so the Makefile skips the arm gate; the `arm` job
      # below covers it.
      - run: make ci TESTFLAGS=-race
      # The screenshot drift gate in `make test` names the screen and the
      # first differing pixel, which says that an image moved but not what
      # it now looks like. Re-render the screens so the run carries the
      # current ones as an artifact to diff against the committed files.
      # It hangs off `failure()` rather than off that test alone because a
      # step cannot ask which test failed; rendering after an unrelated
      # failure costs one `go run` and keeps the condition honest.
      - name: Render current screens
        if: failure()
        continue-on-error: true
        run: make screenshots SCREENSHOT_DIR="${{ runner.temp }}/screenshots"
      - name: Upload current screens
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          # A failure that stops the render (a build error, say) leaves the
          # directory empty; that must not add a second red step.
          if-no-files-found: ignore
          retention-days: 7
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: docker.io/sunsung/pocketbook-go-sdk@sha256:41e9e59022705038d580e7d53a1975e9d92d93f17919abe6e4eaf4054543a507 # tag latest as of 2025-09-03; Dependabot does not track container digests, bump by hand
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image ships Go + the PocketBook ARM clang; ui_arm.go only
      # compiles here, so this is the gate that proves the InkView UI builds.
      - run: make arm VERSION=${{ github.sha }}
