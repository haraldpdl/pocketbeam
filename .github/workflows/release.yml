name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: docker.io/sunsung/pocketbook-go-sdk:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make arm VERSION=${{ github.ref_name }}
      - name: Package
        run: |
          set -eu
          cd dist
          gzip -9 -k -n pocketbeam.app
          sha256sum pocketbeam.app pocketbeam.app.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: dist, path: dist/, if-no-files-found: error, retention-days: 7 }
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PUBLISH_HOST: pocketbeam.shinyredapples.com
      PUBLISH_SSH_HOST: ${{ vars.PUBLISH_SSH_HOST }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: dist }
      - name: Compose release notes and latest.json
        id: notes
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          RAW=$(cut -d' ' -f1 dist/SHA256SUMS | head -1)
          RAW_SIZE=$(stat -c %s dist/pocketbeam.app)
          GZ_SIZE=$(stat -c %s dist/pocketbeam.app.gz)
          BASE="https://${PUBLISH_HOST}/releases/${TAG}"
          {
            echo "pocketbeam ${TAG}"
            echo
            echo "sha256: ${RAW}"
          } > dist/notes.md
          jq -n --arg tag "$TAG" --arg body "$(cat dist/notes.md)" \
                --arg raw "$BASE/pocketbeam.app" --argjson rawsize "$RAW_SIZE" \
                --arg gz "$BASE/pocketbeam.app.gz" --argjson gzsize "$GZ_SIZE" \
            '{tag_name:$tag, body:$body, assets:[
               {name:"pocketbeam.app",    browser_download_url:$raw, size:$rawsize},
               {name:"pocketbeam.app.gz", browser_download_url:$gz,  size:$gzsize}]}' \
            > dist/latest.json
          cat dist/latest.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --notes-file dist/notes.md \
            dist/pocketbeam.app dist/pocketbeam.app.gz dist/SHA256SUMS
      # The on-device updater polls https://<PUBLISH_HOST>/releases/latest.
      # The receiver on that host is a forced SSH command that validates the
      # bundle and swaps it in atomically. Skipped until the key is configured.
      - name: Publish to update endpoint
        if: env.PUBLISH_SSH_HOST != ''
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
          PUBLISH_KNOWN_HOSTS: ${{ vars.PUBLISH_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PUBLISH_KEY" > ~/.ssh/publish_key
          printf '%s\n' "$PUBLISH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C dist -cf - pocketbeam.app pocketbeam.app.gz SHA256SUMS latest.json \
            | ssh -i ~/.ssh/publish_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "pocketbeam@${PUBLISH_SSH_HOST}" "publish ${GITHUB_REF_NAME}"
